name: IREE Metal wheel

on:
  pull_request:
    paths:
      - .github/workflows/iree-metal-*.yml
      - iree_metal/ci/**
      - iree_metal/kernels/*.metal
      - iree_metal/wheel/**
      - scripts/build_iree_metal_wheel.sh
      - scripts/download_iree_metal_native_bundle.sh
      - scripts/smoke_iree_metal_kernels.py
      - scripts/test_iree_metal_wheel.sh
  push:
    branches: [main]
    paths:
      - .github/workflows/iree-metal-*.yml
      - iree_metal/ci/**
      - iree_metal/kernels/*.metal
      - iree_metal/wheel/**
      - scripts/build_iree_metal_wheel.sh
      - scripts/download_iree_metal_native_bundle.sh
      - scripts/smoke_iree_metal_kernels.py
      - scripts/test_iree_metal_wheel.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iree-metal-wheel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install uv and packaging checks
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true

      - name: Download pinned native bundle
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          path="$(./scripts/download_iree_metal_native_bundle.sh "$RUNNER_TEMP/native")"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Build wheel
        env:
          IREE_METAL_NATIVE_BUNDLE_DIR: ${{ steps.native.outputs.path }}
          PYTHON_BIN: python
        run: ./scripts/build_iree_metal_wheel.sh

      - name: Validate package metadata
        run: |
          python -m pip install --disable-pip-version-check twine
          python -m twine check iree_metal/wheel/dist/*.whl

      - name: Install and exercise wheel
        run: ./scripts/test_iree_metal_wheel.sh iree_metal/wheel/dist/*.whl

      - name: Upload tested wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iree-metal-preview-${{ github.sha }}-macos-arm64
          path: iree_metal/wheel/dist/*.whl
          if-no-files-found: error
          retention-days: 14
